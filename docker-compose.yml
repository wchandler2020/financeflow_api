version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: financeflow_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devine11
    ports:
      - "5433:5432"  # ⬅️ CHANGED: Use 5433 externally, 5432 internally
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432  # ⬅️ Internal port stays 5432
      PGDATABASE: financeflow_db
      PGUSER: postgres
      PGPASSWORD: devine11
      JWT_SECRET: test-secret-key-12345
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"