# Application Name
spring.application.name=financeflow-backend

# Server Port
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:financeflow_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:devine11}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-default-secret-key-for-local-development-only}
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Email Configuration (Gmail)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:vastyle2010@gmail.com}
spring.mail.password=${MAIL_PASSWORD:05304988bf5481}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Email Settings
mail.from.email=${MAIL_FROM_EMAIL:your-gmail@gmail.com}
mail.from.name=${MAIL_FROM_NAME:FinanceFlow}

# Frontend URL
app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# Resend Email API Key
resend.api-key=${RESEND_API_KEY:placeholder}

# Open AI configurations
openai.api-key=${OPENAI_API_KEY:placeholder}

# AWS S3 Configuration
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:financeflow-receipts}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID:your-access-key}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:your-secret-key}