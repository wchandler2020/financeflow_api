# Application Name
spring.application.name=financeflow-backend

# Server Port (Railway will override this)
server.port=${PORT:8080}

# Database Configuration
# Railway will provide DATABASE_URL, we'll use it in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/financeflow_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:devine11}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-default-secret-key-for-local-development-only}
jwt.expiration=86400000

# CORS Configuration (will be overridden in production)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR