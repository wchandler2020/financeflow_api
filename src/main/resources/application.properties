# Application Name
spring.application.name=financeflow-backend

# Server Port (Railway provides $PORT)
server.port=${PORT:8080}

# Database Configuration - Use individual components
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:financeflow_db}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:devine11}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-default-secret-key-for-local-development-only}
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR

# Email Configuration (Mailtrap)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:77b0f281f56995}
spring.mail.password=${MAIL_PASSWORD:05304988bf5481}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Email Settings
mail.from.email=${MAIL_FROM_EMAIL:noreply@financeflow.com}
mail.from.name=${MAIL_FROM_NAME:FinanceFlow}

# Frontend URL for verification links
app.frontend-url=${FRONTEND_URL:http://localhost:3000}